services:
  api-monitor:
    image: iwvw/api-monitor:latest
    # image: iwvw/api-monitor:dev # 开发版本可选
    container_name: api-monitor
    restart: unless-stopped
    ports:
      - "${PUBLISHED_HOST:-127.0.0.1}:${API_MONITOR_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - APP_ENV=${APP_ENV:-production}
      - GO_HOST=0.0.0.0
      - PORT=3000
      - DATA_DIR=/app/data
      - DB_NAME=data.db
      - LOG_LEVEL=INFO
      - SECURE_COOKIES=${SECURE_COOKIES:-true}
      - ALLOW_LOCAL_SHELL_TASKS=${ALLOW_LOCAL_SHELL_TASKS:-false}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in your environment}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in your environment}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?set ENCRYPTION_KEY in your environment}
