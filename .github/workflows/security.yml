name: Security Baseline

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20.x
          cache: npm

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Audit Go dependencies and reachable code
        working-directory: backend-go
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          cache-workspaces: agent-rust

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        working-directory: agent-rust
        env:
          CARGO_HTTP_TIMEOUT: 120
          CARGO_NET_RETRY: 10
        run: cargo audit

      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.28.0

      - name: Scan pushed commits for secrets
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            gitleaks git --log-opts="${BASE_SHA}..${HEAD_SHA}" --redact --verbose
          else
            gitleaks git --redact --verbose
          fi

      - name: Scan pull request commits for secrets
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --log-opts="${BASE_SHA}..${HEAD_SHA}" --redact --verbose

      - name: Scan complete repository history for secrets
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: gitleaks git --redact --verbose
