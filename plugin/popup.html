<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>API Monitor 2FA</title>
    <style>
        :root {
            color-scheme: light;
            --bg-color: #f6f7f9;
            --base-color: #ffffff;
            --recessed-color: #f1f3f6;
            --border-color: #d9dee7;
            --border-muted: #e7ebf1;
            --text-main: #111827;
            --text-sub: #697386;
            --accent-color: #2563eb;
            --accent-soft: rgba(37, 99, 235, 0.1);
            --success-color: #16a34a;
            --error-color: #dc2626;
            --shadow-color: rgba(15, 23, 42, 0.1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: dark;
                --bg-color: #101216;
                --base-color: #171a21;
                --recessed-color: #20242d;
                --border-color: #323844;
                --border-muted: #272c36;
                --text-main: #f2f4f7;
                --text-sub: #9aa4b2;
                --accent-color: #60a5fa;
                --accent-soft: rgba(96, 165, 250, 0.14);
                --success-color: #22c55e;
                --error-color: #f87171;
                --shadow-color: rgba(0, 0, 0, 0.32);
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 336px;
            background: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            background: var(--base-color);
        }

        .header-left,
        .header-actions,
        .action-item {
            display: flex;
            align-items: center;
        }

        .header-left { gap: 8px; }
        .header-actions { gap: 6px; }

        .logo {
            display: inline-flex;
            width: 26px;
            height: 26px;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--recessed-color);
            font-size: 14px;
        }

        .title {
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .title small {
            margin-left: 2px;
            color: var(--text-sub);
            font-weight: 600;
        }

        .native-toggle {
            display: inline-flex;
            height: 28px;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--base-color);
            color: var(--text-sub);
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            padding: 0 8px;
        }

        .native-toggle input {
            width: 14px;
            height: 14px;
            accent-color: var(--success-color);
            cursor: pointer;
        }

        .settings-btn {
            display: flex;
            width: auto;
            height: 28px;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--base-color);
            color: var(--text-sub);
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            padding: 0 8px;
            transition: background-color 0.2s, border-color 0.2s, color 0.2s;
        }

        .settings-btn:hover {
            border-color: var(--accent-color);
            background: var(--accent-soft);
            color: var(--accent-color);
        }
        .search-box {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            background: var(--base-color);
        }

        .search-box input {
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--recessed-color);
            color: var(--text-main);
            font-size: 12px;
            outline: none;
            padding: 7px 10px;
        }

        .search-box input::placeholder { color: var(--text-sub); }

        .search-box input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px var(--accent-soft);
        }

        #main {
            min-height: 200px;
            max-height: 480px;
            overflow-y: auto;
            padding: 8px;
        }

        #main::-webkit-scrollbar { display: none; }
        #main { -ms-overflow-style: none; scrollbar-width: none; }

        .group-header {
            padding: 8px 4px 5px;
            color: var(--text-sub);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0;
        }

        .account-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 6px;
            padding: 9px 10px;
            border: 1px solid var(--border-color);
            border-radius: 7px;
            background: var(--base-color);
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .account-item:hover {
            border-color: var(--accent-color);
            background: var(--recessed-color);
        }

        .account-info {
            min-width: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .issuer {
            overflow: hidden;
            color: var(--text-main);
            font-size: 12px;
            font-weight: 700;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .account-name {
            overflow: hidden;
            color: var(--text-sub);
            font-size: 11px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .code-container {
            min-width: 86px;
            text-align: right;
        }

        .code {
            margin-bottom: 4px;
            color: var(--accent-color);
            font-family: ui-monospace, "Cascadia Code", monospace;
            font-size: 17px;
            font-weight: 700;
            line-height: 1;
        }

        .account-progress {
            width: 100%;
            height: 2px;
            overflow: hidden;
            border-radius: 1px;
            background: var(--border-muted);
        }

        .progress-bar {
            height: 100%;
            background: var(--accent-color);
            transition: width 1s linear;
        }

        .progress-bar.low { background: var(--error-color); }

        .state-panel {
            margin: 8px;
            border: 1px solid var(--border-color);
            border-radius: 7px;
            background: var(--base-color);
            color: var(--text-sub);
            font-size: 12px;
            padding: 20px 12px;
            text-align: center;
        }

        .state-panel.error {
            border-color: color-mix(in srgb, var(--error-color) 34%, transparent);
            background: color-mix(in srgb, var(--error-color) 10%, transparent);
            color: var(--error-color);
        }

        .toast {
            position: fixed;
            bottom: 14px;
            left: 50%;
            z-index: 100;
            transform: translateX(-50%) translateY(100px);
            border: 1px solid var(--border-color);
            border-radius: 7px;
            background: var(--base-color);
            box-shadow: 0 8px 24px var(--shadow-color);
            color: var(--text-main);
            font-size: 12px;
            padding: 6px 16px;
            transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <span class="logo">2FA</span>
            <span class="title">双因子认证 <small id="accountCount">(0)</small></span>
        </div>
        <div class="header-actions">
            <div class="action-item" title="总开关">
                <label class="native-toggle">
                    <input type="checkbox" id="toggleMaster" checked>
                    <span>启用</span>
                </label>
            </div>
            <button class="settings-btn" id="btnToggleFill" title="页面图标开关">
                填充
            </button>
            <button class="settings-btn" id="btnSettings" title="设置">
                设置
            </button>
        </div>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索厂商或账号..." autocomplete="off">
    </div>

    <div id="main"></div>
    <div id="toast" class="toast">复制成功</div>

    <script src="popup.js"></script>
</body>
</html>
