<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f7f4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)" />
  <title>API Monitor</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8f7f4;
      --fg: #171512;
      --muted: #78716c;
      --line: rgba(120, 113, 108, 0.24);
      --brand: #dc7d40;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #050505;
        --fg: #f8f7f4;
        --muted: #a8a29e;
        --line: rgba(248, 247, 244, 0.16);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      background: var(--bg);
      color: var(--fg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(100%, 380px);
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: color-mix(in oklab, var(--bg) 92%, var(--fg) 8%);
    }

    img {
      width: 48px;
      height: 48px;
      display: block;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 18px;
      line-height: 1.25;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    button {
      height: 34px;
      border: 0;
      border-radius: 6px;
      background: var(--brand);
      color: #fff;
      padding: 0 13px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <img src="/logo.svg" alt="" />
    <h1>当前离线</h1>
    <p>已安装的应用外壳仍可打开，但监控数据和接口操作需要网络连接。</p>
    <button type="button" onclick="location.reload()">重新连接</button>
  </main>
</body>
</html>
