<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>API Monitor</title>
  <meta name="application-name" content="API Monitor" />
  <meta name="apple-mobile-web-app-title" content="API Monitor" />
  <meta name="description" content="API Monitor monitoring dashboard" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="shortcut icon" href="/logo.svg" />
  <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#f8f7f4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />

  <script type="module" src="/js/app-boot.js"></script>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      margin: 0;
      background: var(--app-loading-bg);
      color: var(--app-loading-fg);
    }

    html {
      --app-loading-bg: #f8f7f4;
      --app-loading-fg: #171512;
      --app-loading-track: rgba(220, 125, 64, 0.18);
      --app-loading-accent: #dc7d40;
    }

    html[data-mode='dark'] {
      --app-loading-bg: #050505;
      --app-loading-fg: #f8f7f4;
      --app-loading-track: rgba(220, 125, 64, 0.22);
    }
  </style>
</head>

<body>
  <div id="app-loading" style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: opacity 0.3s ease-out;
        background: var(--app-loading-bg);
      ">
    <img src="/logo.svg" alt="Loading..." style="
          width: 64px;
          height: 64px;
          margin-bottom: 40px;
          animation: pulse 2s infinite ease-in-out;
        " />
    <div id="loading-progress-track"
      style="width: 160px; height: 5px; border-radius: 999px; overflow: hidden; background: var(--app-loading-track)">
      <div id="loading-progress-bar" style="
            width: 30%;
            height: 100%;
            border-radius: 999px;
            background: var(--app-loading-accent);
            animation: progress-indeterminate 1.5s infinite ease-in-out;
          "></div>
    </div>
    <style>
      @keyframes pulse {
        0% {
          opacity: 0.6;
          transform: scale(0.95);
        }

        50% {
          opacity: 1;
          transform: scale(1);
        }

        100% {
          opacity: 0.6;
          transform: scale(0.95);
        }
      }

      @keyframes progress-indeterminate {
        0% {
          transform: translateX(-150%);
        }

        50% {
          transform: translateX(180%);
        }

        100% {
          transform: translateX(400%);
        }
      }
    </style>
  </div>

  <div id="root"></div>

  <div id="ssh-terminal-warehouse"
    style="visibility:hidden!important;position:absolute!important;left:-9999px!important;top:-9999px!important;width:100px;height:100px;overflow:hidden;pointer-events:none">
  </div>

  <script type="module" src="/js/main.jsx"></script>
</body>

</html>
